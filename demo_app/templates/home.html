<!doctype html>
<html>
<head>
  <title>Member Servicing Console</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f4; }
    .panel { background: white; padding: 24px; max-width: 800px; margin: auto; border: 1px solid #ccc; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    td, th { border: 1px solid #ccc; padding: 8px; text-align: left; }
    input { padding: 8px; }
    button { padding: 8px 16px; }
  </style>
</head>
<body>
<div class="panel">
  <h1>Member Servicing Console</h1>
  <form id="member-search" onsubmit="searchMember(event)">
    <label for="member-id">Member ID</label>
    <input id="member-id" name="member_id" autocomplete="off">
    <button type="submit">Search</button>
  </form>
</div>
<script>
function searchMember(event) {
  event.preventDefault();
  const id = document.getElementById("member-id").value.trim();
  window.location.href = "/member/" + encodeURIComponent(id);
}
</script>
</body>
</html>
